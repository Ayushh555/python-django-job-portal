{% extends 'main.html' %}
{% block content %}

<div class="container mt-5">
    <div class="card p-4 shadow" style="max-width:600px;margin:auto;">

        <h3 class="text-center mb-4">Post a Job</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Job Title</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label>Description</label>
                {{ form.description }}
            </div>

            <div class="form-group">
                <label>Salary</label>
                {{ form.salary }}
            </div>

            <div class="form-group">
                <label>Experience Required (years)</label>
                {{ form.experience_required }}
            </div>

            <button class="btn btn-success btn-block mt-3">
                Post Job
            </button>

        </form>

    </div>
</div>

{% endblock %}
